# Properties can be set in either a global.properties file in ShackBuilder
# or in the local build.properties file of the client repository.
# All properties set in the client file override the global file.
#
# Copy this file to build.properties and set the paths to your local checkouts.

# This property is required!
builder.path=/path/to/ShackBuilder

# Keep packages/tmp and write the build properties to package.properties
# Default: 0
#builder.debug=0

# Required. The manifest has a <scriptfile>, so ShackInstaller is copied into the package
project.ShackInstaller.path=/path/to/ShackInstaller

# Required. Listed in the manifest under <alledia><include>
project.ShackDefaultFiles.path=/path/to/ShackDefaultFiles

# Required. Listed in the manifest under <alledia><relatedExtensions>
project.ShackFramework.path=/path/to/ShackFramework
project.ShackExtensionSupport.path=/path/to/ShackExtensionSupport

# Not used by the build. composer analyse runs PHPStan against this Joomla site
#project.Joomla.path=/path/to/joomla

# After the package has been built, it can be moved to another folder
# Default: not set (the package stays in ./packages)
#project.movePackage=1
#project.movePackageTo=packageFolder
